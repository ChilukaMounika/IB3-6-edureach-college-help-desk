name: CI
 
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
 
permissions:
  contents: read
  statuses: write
 
jobs:
  build:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
 
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
 
      - name: Install and build frontend
        working-directory: client
        run: |
          npm install
          npm run build
 
      - name: Install backend dependencies
        working-directory: server
        run: npm install
 
      - name: Notify Vercel
        if: always()
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Vercel - ib-3-6-edureach-college-help-desk: lint"
          github_token: ${{ secrets.GITHUB_TOKEN }}
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install & build frontend
        working-directory: client
        run: |
          npm install
          npm run build

      - name: Install backend
        working-directory: server
        run: npm install